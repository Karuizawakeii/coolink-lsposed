plugins {
    id "com.android.application"
}

android {
    namespace "io.github.coollink.restorer"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.coollink.restorer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
