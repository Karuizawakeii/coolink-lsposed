plugins {
    id "com.android.application"
}

android {
    namespace "io.github.coollink.restorer"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.coollink.restorer"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // libxposed Modern API 102 is supplied by the Xposed framework at runtime.
    compileOnly "io.github.libxposed:api:102.0.0"
    testImplementation "junit:junit:4.13.2"
}
